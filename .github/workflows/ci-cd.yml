name: SAST Scan with Bearer CLI and Vercel Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and run tests
        run: |
          npm install
          npm test

      - name: Install Bearer CLI (OWASP SAST & Data Flow Scanner)
        run: |
          curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run SAST and data flow analysis with Bearer CLI
        run: |
          bearer scan src --scanner=sast,secrets --exit-code=0 --no-color > bearer-report.txt
          bearer scan src --report=dataflow --exit-code=0 --no-color > bearer-dataflow.txt
          echo "## SAST Vulnerability Report - Bearer CLI" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat bearer-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## Sensitive Data Flow Map - Bearer CLI" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat bearer-dataflow.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload SAST report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bearer-security-reports
          path: |
            bearer-report.txt
            bearer-dataflow.txt

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: security-and-build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        continue-on-error: true
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
